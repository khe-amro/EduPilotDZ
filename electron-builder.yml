appId: com.edupilot.commercial.v2
productName: Edupilot 2 Commercial
copyright: Copyright © 2026 Edupilot
buildVersion: 2.0.0

directories:
  output: release/v2.0.0
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  - from: src/renderer/assets/sounds
    to: sounds
  - from: src/renderer/assets/fonts
    to: fonts

win:
  target:
    - nsis
  icon: build/icons/icon.ico
  executableName: Edupilot2
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Edupilot 2 Commercial
  deleteAppDataOnUninstall: false
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico
  installerHeaderIcon: build/icons/icon.ico
  license: false
  menuCategory: true
  artifactName: Edupilot-2.0.0-Setup.exe

asar: true
asarUnpack:
  - "**/*.node"

compression: maximum
